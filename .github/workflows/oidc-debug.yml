name: Debug OIDC

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  debug:
    name: Show the claims
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Show the token claims
        env:
          AUDIENCE: marketplace.visualstudio.com
        run: |
          URL="$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$AUDIENCE"
          TOKEN=$(curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$URL" | jq -r .value)
          echo "token length: ${#TOKEN}"
          PAYLOAD=$(echo "$TOKEN" | cut -d. -f2 | tr '_-' '/+')
          case $((${#PAYLOAD} % 4)) in
            2) PAYLOAD="$PAYLOAD==" ;;
            3) PAYLOAD="$PAYLOAD=" ;;
          esac
          echo "$PAYLOAD" | base64 -d 2>/dev/null | jq .
