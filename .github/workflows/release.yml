name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  package:
    name: Build the vsix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install the dependencies
        run: npm ci

      - name: Build the package
        run: npm run package

      - name: Publish the package
        uses: actions/upload-artifact@v4
        with:
          name: minimax-agent
          path: "*.vsix"
