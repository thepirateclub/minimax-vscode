name: Publish

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish to the Marketplace
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install the dependencies
        run: npm ci

      - name: Find a working token exchange
        env:
          PUBLISHER: katagarov
        run: |
          set -u
          request_token() {
            local url="$1"
            curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$url" | jq -r '.value // empty'
          }
          exchange() {
            local token="$1"
            local body="$2"
            curl -s -o /tmp/resp.json -w '%{http_code}' -X POST \
              -H "Accept: application/json" \
              -H "Authorization: FederatedToken $token" \
              -H "Content-Type: application/json" \
              -d "$body" \
              "https://marketplace.visualstudio.com/_apis/gallery/token?api-version=7.2-preview.1"
          }
          BASE="$ACTIONS_ID_TOKEN_REQUEST_URL"
          SEP="&"
          case "$BASE" in
            *?*) SEP="&" ;;
            *) SEP="?" ;;
          esac

          echo "### A: default token, plain publisherName"
          T=$(request_token "$BASE$SEP"audience=marketplace.visualstudio.com")
          echo "token_len=${#T}"
          CODE=$(exchange "$T" "{\"publisherName\":\"$PUBLISHER\"}")
          echo "A status=$CODE body=$(cat /tmp/resp.json | head -c 400)"

          echo "### B: custom sub, legacy format, branch main"
          T=$(request_token "$BASE$SEP"audience=marketplace.visualstudio.com&sub=repo:thepirateclub/minimax-vscode:ref:refs/heads/main")
          CODE=$(exchange "$T" "{\"publisherName\":\"$PUBLISHER\"}")
          echo "B status=$CODE body=$(cat /tmp/resp.json | head -c 400)"

          echo "### C: custom sub, legacy format, environment production"
          T=$(request_token "$BASE$SEP"audience=marketplace.visualstudio.com&sub=repo:thepirateclub/minimax-vscode:environment:production")
          CODE=$(exchange "$T" "{\"publisherName\":\"$PUBLISHER\"}")
          echo "C status=$CODE body=$(cat /tmp/resp.json | head -c 400)"

          echo "### D: custom sub, immutable format with ids"
          T=$(request_token "$BASE$SEP"audience=marketplace.visualstudio.com&sub=repo:thepirateclub@69038132/minimax-vscode@1471923900:ref:refs/heads/main")
          CODE=$(exchange "$T" "{\"publisherName\":\"$PUBLISHER\"}")
          echo "D status=$CODE body=$(cat /tmp/resp.json | head -c 400)"
